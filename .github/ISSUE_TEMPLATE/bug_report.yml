name: Bug report
description: Report a reproducible problem in llm-bridge
title: "Bug: "
labels: [bug]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues
          required: true
  - type: input
    id: version
    attributes:
      label: llm-bridge version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: llm-bridge doctor --json output
      description: Run this status check; do not include credentials, prompts, or private paths.
      render: json
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use public or synthetic inputs only.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Include normalized errors only. Remove personal data and secrets.
